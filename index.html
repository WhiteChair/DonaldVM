<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Donald Van Marcke - Change Management & Digital Transformation Professional">
  <title>Donald Van Marcke | Interactive Resume</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { height: 100%; width: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .animate-bounce { animation: bounce 1s infinite; }
    @keyframes bounce {
      0%, 100% { transform: translateY(-25%) translateX(-50%); animation-timing-function: cubic-bezier(0.8,0,1,1); }
      50% { transform: translateY(0) translateX(-50%); animation-timing-function: cubic-bezier(0,0,0.2,1); }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function BikeResume() {
      const [scrollProgress, setScrollProgress] = useState(0);
      const [scrollY, setScrollY] = useState(0);
      const [pedalRotation, setPedalRotation] = useState(0);
      const containerRef = useRef(null);
      
      useEffect(() => {
        const handleScroll = () => {
          if (containerRef.current) {
            const { scrollTop, scrollHeight, clientHeight } = containerRef.current;
            const progress = scrollTop / (scrollHeight - clientHeight);
            setScrollProgress(progress);
            setScrollY(scrollTop);
            setPedalRotation(scrollTop * 1.5);
          }
        };
        const container = containerRef.current;
        if (container) {
          container.addEventListener('scroll', handleScroll);
          return () => container.removeEventListener('scroll', handleScroll);
        }
      }, []);

      const bikeY = 100 + scrollY * 0.15;
      const wheelRotation = pedalRotation * 2;

      const BikeWithChildSeat = ({ scale = 1 }) => (
        <svg width={140 * scale} height={100 * scale} viewBox="0 0 140 100">
          <g transform={`rotate(${wheelRotation}, 30, 70)`}>
            <circle cx="30" cy="70" r="18" fill="none" stroke="#2d3748" strokeWidth="2.5"/>
            <circle cx="30" cy="70" r="12" fill="none" stroke="#a0aec0" strokeWidth="0.5"/>
            {[0,45,90,135].map(a => <line key={a} x1="30" y1="52" x2="30" y2="88" stroke="#a0aec0" strokeWidth="0.5" transform={`rotate(${a},30,70)`}/>)}
          </g>
          <g transform={`rotate(${wheelRotation}, 105, 70)`}>
            <circle cx="105" cy="70" r="18" fill="none" stroke="#2d3748" strokeWidth="2.5"/>
            <circle cx="105" cy="70" r="12" fill="none" stroke="#a0aec0" strokeWidth="0.5"/>
            {[0,45,90,135].map(a => <line key={a} x1="105" y1="52" x2="105" y2="88" stroke="#a0aec0" strokeWidth="0.5" transform={`rotate(${a},105,70)`}/>)}
          </g>
          <path d="M30,70 L55,42 L55,70 L30,70" fill="none" stroke="#1a365d" strokeWidth="2.5" strokeLinejoin="round"/>
          <line x1="55" y1="70" x2="105" y2="70" stroke="#1a365d" strokeWidth="2.5"/>
          <line x1="55" y1="42" x2="90" y2="42" stroke="#1a365d" strokeWidth="2"/>
          <line x1="90" y1="42" x2="105" y2="70" stroke="#1a365d" strokeWidth="2.5"/>
          <line x1="90" y1="30" x2="90" y2="45" stroke="#4a5568" strokeWidth="2"/>
          <line x1="82" y1="30" x2="98" y2="30" stroke="#4a5568" strokeWidth="2"/>
          <line x1="55" y1="42" x2="55" y2="28" stroke="#4a5568" strokeWidth="2"/>
          <ellipse cx="55" cy="25" rx="8" ry="3" fill="#4a5568"/>
          <g transform={`rotate(${pedalRotation}, 55, 70)`}>
            <circle cx="55" cy="70" r="5" fill="#4a5568"/>
            <line x1="55" y1="62" x2="55" y2="78" stroke="#2d3748" strokeWidth="2"/>
            <rect x="51" y="59" width="8" height="3" rx="1" fill="#2d3748"/>
            <rect x="51" y="78" width="8" height="3" rx="1" fill="#2d3748"/>
          </g>

          <rect x="20" y="40" width="20" height="12" rx="2" fill="#fc8181"/>
          <line x1="18" y1="52" x2="42" y2="52" stroke="#c53030" strokeWidth="1"/>
          <circle cx="30" cy="35" r="7" fill="#fbd38d"/>
          <circle cx="27" cy="33" r="1.5" fill="#2d3748"/>
          <circle cx="33" cy="33" r="1.5" fill="#2d3748"/>
          <path d="M27,37 Q30,40 33,37" stroke="#2d3748" strokeWidth="1" fill="none"/>
          <ellipse cx="30" cy="28" rx="8" ry="5" fill="#9f7aea"/>
          <rect x="25" y="42" width="10" height="12" rx="2" fill="#48bb78"/>

          <circle cx="57" cy="10" r="2" fill="#2d3748"/>
          <circle cx="63" cy="10" r="2" fill="#2d3748"/>

        </svg>

      const Sun = () => (

            <circle cx="130" cy="105" r="14" fill="#1e293b" stroke="#374151" strokeWidth="3"/>
            <circle cx="172" cy="105" r="14" fill="#1e293b" stroke="#374151" strokeWidth="3"/>
            <circle cx="40" cy="105" r="5" fill="#4b5563"/>

            <circle cx="130" cy="105" r="5" fill="#4b5563"/>
            <circle cx="172" cy="105" r="5" fill="#4b5563"/>
            <polygon points="0,95 10,70 10,95" fill="#991b1b"/>
          </svg>
        </div>
      );

      const Office = ({ x, variant = 0 }) => (
        <div className="absolute bottom-0" style={{ left: `${x}%`, zIndex: 6 }}>
          <svg width="90" height="100" viewBox="0 0 90 100">
            <rect x="5" y="18" width="80" height="82" fill={variant === 0 ? "#718096" : "#a0aec0"}/>
            <rect x="0" y="12" width="90" height="10" fill={variant === 0 ? "#4a5568" : "#718096"}/>
            {[0,1,2].map(col => [0,1,2].map(row => (
              <rect key={`${col}-${row}`} x={14 + col * 24} y={28 + row * 24} width="16" height="14" fill={Math.random() > 0.45 ? "#faf089" : "#2d3748"}/>
            )))}
            <rect x="35" y="72" width="20" height="28" fill="#2d3748"/>
          </svg>
        </div>
      );

      const Chatbot = ({ x, y }) => (
        <div className="absolute" style={{ left: `${x}%`, bottom: `${y}px`, zIndex: 8 }}>
          <svg width="45" height="55" viewBox="0 0 45 55">
            <rect x="5" y="10" width="35" height="32" rx="7" fill="#4299e1"/>
            <circle cx="15" cy="24" r="4.5" fill="white"/>
            <circle cx="30" cy="24" r="4.5" fill="white"/>
            <circle cx="15" cy="24" r="2" fill="#1a202c"/>
            <circle cx="30" cy="24" r="2" fill="#1a202c"/>
            <path d="M13,33 Q22.5,40 32,33" stroke="white" strokeWidth="2" fill="none"/>
            <rect x="18" y="0" width="9" height="11" fill="#a0aec0"/>
            <circle cx="22.5" cy="2" r="4.5" fill="#48bb78"/>
            <rect x="10" y="42" width="25" height="7" rx="2" fill="#a0aec0"/>

      );

      const Tree = ({ x, size = 1, variant = 0 }) => (
        <div className="absolute bottom-0" style={{ left: `${x}%`, zIndex: 4, transform: `scale(${size})` }}>
          <svg width="36" height="62" viewBox="0 0 36 62">
            <rect x="14" y="42" width="8" height="20" fill="#92400e"/>
            <polygon points="18,0 3,42 33,42" fill={variant === 0 ? "#228B22" : "#2d5a27"}/>

      const ClassicalSchool = ({ x, variant = 0 }) => (
